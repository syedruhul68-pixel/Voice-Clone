steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set up JDK 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Install required packages
    run: sudo apt-get update && sudo apt-get install -y wget unzip gradle

  - name: Generate Gradle wrapper (CI)
    run: gradle wrapper --gradle-version 8.1.1

  - name: Ensure gradlew is executable
    run: chmod +x ./gradlew

  - name: Install Android command line tools and SDK components
    run: |
      mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
      wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O /tmp/cmdline.zip
      unzip -q /tmp/cmdline.zip -d $ANDROID_SDK_ROOT/cmdline-tools
      mkdir -p $ANDROID_SDK_ROOT/cmdline-tools/latest
      mv $ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools/* $ANDROID_SDK_ROOT/cmdline-tools/latest/ || true
      echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
      echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH
      echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
      yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_SDK_ROOT "platform-tools" "platforms;android-34" "build-tools;34.0.0"

  - name: Build Debug APK
    run: ./gradlew :android-client:assembleDebug --stacktrace

  - name: Upload APK artifact
    uses: actions/upload-artifact@v4
    with:
      name: app-debug-apk
      path: android-client/app/build/outputs/apk/debug/*.apk
