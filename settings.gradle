rootProject.name = "Voice-Clone"

dependencyResolutionManagement {
    // Ensure the project uses the repositories declared here (not module-level repositories)
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)

    repositories {
        // Required for AndroidX/Compose artifacts
        google()
        // Required for many libraries
        mavenCentral()
        // Optional: keep if you use libraries from JitPack
        maven { url 'https://jitpack.io' }
    }
}

// Include the Android app which lives in android-client/app
include(":android-client:app")
project(":android-client:app").projectDir = file("android-client/app")
